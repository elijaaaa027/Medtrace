name: Deploy MedTrace to Google Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  SERVICE_NAME: 'medtrace-0'
  REGION: 'asia-east1'
  PORT: '8080'
  ARCHIVE_NAME: 'app.tar.gz'

jobs:
  build-package-deploy:
    name: Package and Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Google Cloud Workload Identity Federation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install --omit=dev

      - name: Build Project
        run: npm run build

      - name: Package Application into Verified tar.gz Archive
        run: |
          echo "=========================================================="
          echo "Step: Packaging application into valid POSIX tar.gz"
          echo "=========================================================="
          node package-tarball.cjs
          
          if [ ! -s "${ARCHIVE_NAME}" ]; then
            echo "FATAL: ${ARCHIVE_NAME} was not generated or is empty!"
            exit 1
          fi
          
          echo "Verifying archive size and root folder structure:"
          ls -lh "${ARCHIVE_NAME}"
          tar -tzf "${ARCHIVE_NAME}" | grep -E "^\./(Dockerfile|package\.json|server\.cjs|dev-server\.cjs|index\.html)$"
          echo "... build folder structure verified successfully."

      - name: Upload Deployment Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medtrace-cloud-run-tarball
          path: app.tar.gz
          retention-days: 14

      # Authenticate to Google Cloud using either Workload Identity Federation or Service Account Key
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Google Cloud Run explicitly using app.tar.gz
        run: |
          echo "Deploying to Google Cloud Run from ${ARCHIVE_NAME}..."
          gcloud run deploy "${SERVICE_NAME}" \
            --source="./${ARCHIVE_NAME}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port="${PORT}" \
            --set-env-vars=NODE_ENV=production
