  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            theme: {
              primary: 'var(--theme-primary)',
              hover: 'var(--theme-primary-hover)'
            }
          }
        }
      }

  <style>
    :root {
      --theme-primary: #0D9488;
      --theme-primary-hover: #0F766E;
      --theme-gradient: linear-gradient(135deg, #0D9488 0%, #06B6D4 100%);
      --theme-glow: rgba(13, 148, 136, 0.32);
      --theme-subtle: rgba(13, 148, 136, 0.12);
      --theme-border-hover: rgba(13, 148, 136, 0.55);
    }
    * { transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    
    .custom-sidebar-scroll::-webkit-scrollbar { width: 6px; }
    .custom-sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 9999px; }
    .custom-sidebar-scroll::-webkit-scrollbar-thumb:hover { background: var(--theme-primary); }

    .hover-poppy {
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hover-poppy:hover {
      transform: translateY(-2.5px) scale(1.015);
      box-shadow: 0 12px 28px -5px var(--theme-glow);
      border-color: var(--theme-border-hover);
    }

    .card-gradient-hover {
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(226, 232, 240, 0.85);
    }
    html.dark .card-gradient-hover {
      border: 1px solid rgba(51, 65, 85, 0.7);
    }
    .card-gradient-hover:hover {
      transform: translateY(-2px);
      border-color: var(--theme-border-hover) !important;
      box-shadow: 0 14px 30px -8px var(--theme-glow);
    }

    .btn-theme-poppy {
      background: var(--theme-gradient);
      color: #ffffff !important;
      box-shadow: 0 4px 14px 0 var(--theme-glow);
      transition: all 0.2s ease;
    }
    .btn-theme-poppy:hover {
      filter: brightness(1.08);
      transform: translateY(-1.5px) scale(1.02);
      box-shadow: 0 8px 22px 0 var(--theme-glow);
    }
    .badge-theme-subtle {
      background-color: var(--theme-subtle);
      color: var(--theme-primary);
      border: 1px solid var(--theme-border-hover);
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 var(--theme-glow); }
      50% { box-shadow: 0 0 0 12px rgba(13, 148, 136, 0); }
    }
    .biometric-pulse {
      animation: pulseGlow 2.2s infinite;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @media print {
      body * { visibility: hidden; }
      #printable-slip, #printable-slip * { visibility: visible; }
      #printable-slip { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>

    // Mobile Toast Notification Helper
    window.showToast = function(message, type = 'success') {
      let toastContainer = document.getElementById('medtrace-toast-container');
      if (!toastContainer) {
        toastContainer = document.createElement('div');
        toastContainer.id = 'medtrace-toast-container';
        toastContainer.className = 'fixed bottom-5 right-5 z-[9999] flex flex-col gap-2 max-w-sm pointer-events-none';
        document.body.appendChild(toastContainer);
      }
      const toast = document.createElement('div');
      const bg = type === 'error' ? 'bg-rose-600 text-white' : type === 'info' ? 'bg-sky-600 text-white' : 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900';
      toast.className = `${bg} px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-bold border border-white/10 pointer-events-auto transition-all duration-300`;
      const icon = type === 'error' ? '⚠️' : type === 'info' ? 'ℹ️' : '✓';
      toast.innerHTML = `<span class="text-base">${icon}</span><span class="flex-1">${message}</span><button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100 text-sm ml-2">✕</button>`;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    };

    function loadState() {
      try {
        const saved = localStorage.getItem('medtrace_state_v3');
        if (saved) {
          const parsed = JSON.parse(saved);
          state = Object.assign(state, parsed);
          window.state = state;
        }
      } catch (e) {
        console.warn('Could not load stored state:', e);
      }
      applyTheme();
    }

    function saveState() {
      try {
        localStorage.setItem('medtrace_state_v3', JSON.stringify(state));
      } catch (e) {
        console.warn('Failed saving state to localStorage:', e);
      }
    }

    function applyTheme() {
      const palette = THEME_PALETTES[state.themeColor] || THEME_PALETTES.aqua;
      const root = document.documentElement;
      root.style.setProperty('--theme-primary', palette.primary);
      root.style.setProperty('--theme-primary-hover', palette.hover);
      root.style.setProperty('--theme-gradient', palette.gradient);
      root.style.setProperty('--theme-glow', palette.glow);
      root.style.setProperty('--theme-subtle', palette.subtle);
      root.style.setProperty('--theme-border-hover', palette.borderHover);

      if (state.isDarkMode) {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }
    }

    function setLanguage(code) {
      state.language = code;
      saveState();
      render();
    }

    function setThemeColor(colorId) {
      if (THEME_PALETTES[colorId]) {
        state.themeColor = colorId;
        applyTheme();
        saveState();
        render();
      }
    }

    function toggleDarkMode() {
      state.isDarkMode = !state.isDarkMode;
      applyTheme();
      saveState();
      render();
    }

    function toggleRightPortal() {
      state.showRightPortal = !state.showRightPortal;
      saveState();
      render();
    }

    function logActivity(text, category) {
      if (!state.activeUserId) return;
      const u = ensureUserBucket(state.activeUserId);
      u.activityLogs.unshift({
        id: 'act-' + Date.now(),
        text: text,
        category: category || 'General',
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      if (u.activityLogs.length > 25) u.activityLogs.pop();
    }

    function toggleMedicationDose(medId) {
      if (!state.activeUserId) return;
      const u = ensureUserBucket(state.activeUserId);
      const med = u.medicines.find(m => m.id === medId);
      if (med) {
        med.takenToday = !med.takenToday;
        med.takenTodayTime = med.takenToday ? new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : null;
        logActivity((med.takenToday ? 'Marked taken: ' : 'Marked pending: ') + med.medicineName, 'Medications');

    window.handleLocationInput = function(query) {
      const container = document.getElementById('location-suggestions-container');
      if (!container) return;
      if (!query || query.trim().length < 2) {
        container.classList.add('hidden');
        return;
      }
      fetch('/api/places-suggest?q=' + encodeURIComponent(query))
        .then(r => r.json())
        .then(data => {
          const results = data.results || [];
          if (results.length === 0) {
            container.innerHTML = `<div class="p-2.5 text-xs text-slate-400">No landmark matches found</div>`;
            container.classList.remove('hidden');
            return;

          container.innerHTML = results.map(item => `

          `).join('');

        });

    async function sendAiChatMessage(userText) {
      if (!state.activeUserId) return;
      const u = ensureUserBucket(state.activeUserId);
      const text = userText.trim();
      if (!text) return;

      const userMsg = {
        id: 'msg-' + Date.now(),
        role: 'user',
        text: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        placeLinks: []
      };
      u.chatMessages.push(userMsg);
      isChatLoading = true;
      render();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: u.chatMessages.map(m => ({ role: m.role, text: m.text })),
            userLocation: state.userGeoLocation,
            enableMapsGrounding: true,
            model: state.chatModel || 'gemini-3.8-flash',
            language: state.language || 'en',
            patientContext: {
              fullName: u.profile.fullName,
              bloodGroup: u.snapshot.bloodGroup,
              bp: u.snapshot.bp,
              hba1c: u.snapshot.hba1c,
              allergies: u.snapshot.allergies,
              medications: u.medicines.map(m => m.medicineName + ' ' + m.dosage).join(', '),
              activeInsurance: u.insurancePolicies.filter(p => p.isActive).map(p => p.providerName).join(', '),
              upcomingAppointments: u.appointments.filter(a => a.status === 'Confirmed').map(a => a.doctorName + ' at ' + a.hospitalOrClinic + ' on ' + a.appointmentDate).join('; ')
            }
          })
        });
        const data = await response.json();
        const replyText = data.reply || 'MedTrace clinical guidance is active.';
        const placeLinks = (data.groundingChunks || [])
          .filter(c => c.maps)
          .map(c => ({
            title: c.maps.title || 'Medical Facility',
            address: (c.maps.placeAnswerSources && c.maps.placeAnswerSources.reviewSnippets) ? c.maps.placeAnswerSources.reviewSnippets[0] : 'Healthcare Center',
            uri: c.maps.uri || 'https://www.google.com/maps'
          }));

        u.chatMessages.push({
          id: 'msg-' + Date.now() + 1,
          role: 'model',
          text: replyText,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          placeLinks: placeLinks
        });
      } catch (err) {
        console.error('Chat error:', err);
        const t = I18N[state.language || 'en'] || I18N.en;
        u.chatMessages.push({
          id: 'msg-err-' + Date.now(),
          role: 'model',
          text: state.language === 'ta'
            ? 'மெட்டிரேஸ் அவசர தகவல்: உங்கள் வினவல் பெறப்பட்டது. அவசர மருத்துவ உதவிக்கு உடனே 108 அல்லது அரவிந்த்/மீனாட்சி மருத்துவமனையை அணுகவும்.'
            : state.language === 'hi'
            ? 'मेडट्रेस आपातकालीन सूचना: आपका संदेश प्राप्त हुआ। किसी भी तीव्र स्वास्थ्य समस्या के लिए 108/112 या नजदीकी अस्पताल से संपर्क करें।'
            : 'MedTrace Clinical Notice: Please consult a licensed physician or dial 112/108 for acute emergency conditions.',
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          placeLinks: [
            {
              title: 'Nearby 24/7 Hospitals on Google Maps',
              address: 'Tap to view accredited medical centers in your vicinity',
              uri: 'https://www.google.com/maps/search/hospitals+near+me'
            }
          ]
        });
      } finally {
        isChatLoading = false;
        saveState();
        render();
        const box = document.getElementById('chat-thread-container');

      }
    }

      if (!biometricModal) return '';
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
            <div class="w-16 h-16 mx-auto rounded-3xl flex items-center justify-center text-3xl btn-theme-poppy biometric-pulse">🫆</div>
            <h3 class="font-extrabold text-base">${t.biometricLoginButton}</h3>
            <p class="text-xs text-slate-500">Scan registered fingerprint or use camera face verification</p>
            <div class="space-y-2">
              <button onclick="state.activeUserId='9840123456';biometricModal=null;saveState();render();" class="w-full py-3 rounded-2xl btn-theme-poppy font-bold text-xs">
                Simulate Successful Biometric Login
              </button>
              <button onclick="biometricModal=null;render();" class="w-full py-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-500">
                Cancel
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // AUTH SCREEN
    function renderAuthScreen(app, t) {
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-950">
          <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 space-y-6 shadow-xl card-gradient-hover">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl font-black btn-theme-poppy">⚕️</div>
                <div>
                  <h1 class="text-xl font-black">${t.appName}</h1>
                  <p class="text-xs text-slate-500 font-semibold">${t.tagline}</p>
                </div>
              </div>
              ${renderLanguageBar(t)}
            </div>

            <div class="space-y-1">
              <h2 class="text-lg font-bold">${t.loginTitle}</h2>
              <p class="text-xs text-slate-500">${t.loginSubtitle}</p>
            </div>

            <form onsubmit="
              event.preventDefault();
              const phone = document.getElementById('auth-phone').value;
              if(phone && phone.length === 10) {
                state.activeUserId = phone;
                ensureUserBucket(phone);
                saveState();
                render();
              } else {
                showToast('Please enter a valid 10-digit mobile number.', 'error');
              }
            " class="space-y-4 text-xs">
              <div>
                <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">${t.phoneNumberLabel}</label>
                <div class="flex gap-2">
                  <span class="px-3.5 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-xs flex items-center">+91</span>
                  <input id="auth-phone" type="tel" pattern="[0-9]{10}" value="9840123456" required placeholder="${t.phonePlaceholder}" class="flex-1 p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold focus:outline-none" />
                </div>
              </div>

              <button type="submit" class="w-full py-3.5 rounded-2xl btn-theme-poppy font-extrabold text-xs shadow-md">
                ${t.verifyOtpButton} (Demo PIN: Instant)
              </button>
            </form>

            <div class="pt-2 text-center">
              <button onclick="biometricModal={ phone: '9840123456' }; render();" class="text-xs font-bold" style="color: var(--theme-primary);">
                🫆 ${t.biometricLoginButton}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Expose all functions onto window object for inline HTML event safety
    window.render = render;
    window.saveState = saveState;
    window.loadState = loadState;
    window.applyTheme = applyTheme;
    window.setLanguage = setLanguage;
    window.setThemeColor = setThemeColor;
    window.toggleDarkMode = toggleDarkMode;
    window.toggleRightPortal = toggleRightPortal;
    window.ensureUserBucket = ensureUserBucket;
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.openHospitalDirectBooking = openHospitalDirectBooking;
    window.toggleReminderDose = toggleReminderDose;
    window.bookHospitalSlot = typeof bookHospitalSlot !== 'undefined' ? bookHospitalSlot : null;
    window.sendChatMessage = typeof sendChatMessage !== 'undefined' ? sendChatMessage : null;
    window.handleQuickChat = typeof handleQuickChat !== 'undefined' ? handleQuickChat : null;

    // Initialize state & start application
    loadState();
    render();
  </script>
</body>
</html>
